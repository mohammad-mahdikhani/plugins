# Apache vhost: Daftarchi next to WordPress on the same cPanel/VPS.
# WordPress stays on webakery.ir. This vhost is only the subdomain.
#
# Example: pos.webakery.ir  →  gunicorn 127.0.0.1:8080
# Copy into /etc/apache2/sites-available/ or a WHM include. On shared cPanel,
# create the subdomain in the UI then use php-proxy.php if ProxyPass is denied.

<VirtualHost *:80>
    ServerName pos.webakery.ir
    Redirect permanent / https://pos.webakery.ir/
</VirtualHost>

<VirtualHost *:443>
    ServerName pos.webakery.ir
    # SSLEngine on
    # SSLCertificateFile      /path/to/fullchain.pem
    # SSLCertificateKeyFile   /path/to/privkey.pem

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    ProxyPass        / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/

    # WordPress on webakery.ir is a different vhost. Do not ProxyPass /wp-admin here.
</VirtualHost>
