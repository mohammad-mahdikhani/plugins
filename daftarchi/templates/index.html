<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#16315f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="دفترچی">
  <title>دفترچی</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/static/icon-192.png">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <link rel="stylesheet" href="/static/css/app.css?v={{VERSION}}">
  <script>
    window.__desk = { event: null };
    window.addEventListener("beforeinstallprompt", (event) => {
      event.preventDefault();
      window.__desk.event = event;
    });
  </script>
</head>
<body>
  <div id="app"></div>
  <script src="/static/js/app.js?v={{VERSION}}" defer></script>
  <script>
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js", { updateViaCache: "none" });
  </script>
</body>
</html>
