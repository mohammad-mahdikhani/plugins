<!DOCTYPE html>
<html lang="fa-IR" dir="rtl">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>سه دکمه قدیمی باید یکی شود</title>
	<link rel="stylesheet" href="../assets/frontend/reporter.css">
	<style>
		body { margin: 0; min-height: 100vh; font-family: Tahoma, sans-serif; background: #f7faf6; }
		.page { padding: 40px 24px; }
	</style>
	<script>
		window.NPBR_CFG = {
			ajax: '',
			nonce: 'preview',
			buttonLabel: 'گزارش خطا',
			showFloating: true,
			showNearPay: false,
			showNearCart: false,
			autoWatch: false,
			pageKind: 'checkout',
			requireNote: true,
			requireLogin: true,
			requireVerified: true,
			canReport: true,
			loginUrl: '/my-account/',
			site: 'https://nahal.website/',
			customer: { loggedIn: true, verified: true, firstName: 'علی', lastName: 'محمدی', phone: '09120000000' }
		};
	</script>
</head>
<body class="rtl">
	<div class="page"><p>نسخه قدیمی سه دکمه داشت؛ اسکریپت باید آن‌ها را به یک دکمه «گزارش خطا» تبدیل کند.</p></div>
	<div id="npbr-root" class="npbr-root" hidden>
		<button type="button" class="npbr-fab" data-npbr-open>گزارش خطا</button>
		<div class="npbr-overlay" data-npbr-close hidden></div>
		<section class="npbr-modal" role="dialog" aria-modal="true" aria-labelledby="npbr-title" hidden>
			<header class="npbr-head"><h2 id="npbr-title">گزارش خطا در خرید و پرداخت</h2><button type="button" class="npbr-x" data-npbr-close aria-label="بستن">×</button></header>
			<div class="npbr-body">
				<label class="npbr-label" for="npbr-note">شرح خطا <span>*</span></label>
				<textarea id="npbr-note" class="npbr-note" rows="4" maxlength="4000"></textarea>
				<figure class="npbr-shot-wrap"><figcaption>پیش‌نمایش اسکرین‌شات</figcaption><img id="npbr-shot" alt="اسکرین‌شات صفحه" hidden><p id="npbr-shot-empty">هنوز گرفته نشده.</p></figure>
				<div id="npbr-downloads" class="npbr-downloads" hidden></div>
				<div id="npbr-prompt-wrap" class="npbr-prompt-wrap" hidden>
					<label class="npbr-label" for="npbr-prompt">پرامپت آماده برای ایجنت هوش مصنوعی</label>
					<textarea id="npbr-prompt" class="npbr-prompt" rows="6" readonly></textarea>
					<button type="button" class="npbr-btn npbr-btn-dark" data-npbr-copy-prompt>کپی پرامپت</button>
				</div>
				<p id="npbr-status" class="npbr-status" role="status"></p>
			</div>
			<footer class="npbr-actions">
				<button type="button" class="npbr-btn npbr-btn-light" data-npbr-download>دانلود گزارش و اسکرین</button>
				<button type="button" class="npbr-btn npbr-btn-light" data-npbr-prompt>پرامپت ایجنت</button>
				<button type="button" class="npbr-btn npbr-btn-dark" data-npbr-send>ارسال برای مدیر و تلگرام</button>
			</footer>
		</section>
	</div>
	<script src="../assets/frontend/html2canvas.min.js"></script>
	<script src="../assets/frontend/reporter.js"></script>
</body>
</html>
